<!DOCTYPE html>
<html lang="uk" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Чек-лист ресторану</title>
  
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
          }
        }
      }
    };
  </script>

  <style>
    /* Prevent accidental pull-to-refresh & pinch zoom */
    html, body {
      overscroll-behavior-y: contain;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-full flex flex-col font-sans antialiased transition-colors">

  <!-- Header -->
  <header class="sticky top-0 z-30 bg-white/95 dark:bg-slate-900/95 backdrop-blur-sm border-b border-slate-200 dark:border-slate-800 px-4 py-3.5">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div>
        <h1 class="text-base font-bold text-slate-900 dark:text-white leading-tight">Контрольний чек-лист</h1>
        <p id="current-datetime" class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">Оновлення часу...</p>
      </div>

      <button id="theme-toggle" class="p-2 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition" aria-label="Змінити тему">
        <span id="theme-icon">🌙</span>
      </button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 max-w-md w-full mx-auto px-4 py-4 space-y-4">
    
    <!-- Worker Info Card -->
    <div class="bg-white dark:bg-slate-800 rounded-xl p-3.5 border border-slate-200 dark:border-slate-700/80 shadow-xs">
      <label for="worker-name" class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1.5 uppercase tracking-wide">
        Відповідальний за зміну
      </label>
      <input 
        type="text" 
        id="worker-name" 
        placeholder="Вкажіть ваше ім'я або посаду..." 
        class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg px-3 py-2.5 text-sm text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-800 dark:focus:ring-slate-400 transition"
      />
    </div>

    <!-- Zone Selector (Kitchen / Hall) -->
    <div class="grid grid-cols-2 gap-1 p-1 bg-slate-200 dark:bg-slate-950 rounded-xl">
      <button 
        id="btn-zone-kitchen" 
        class="py-2.5 px-3 rounded-lg text-sm font-semibold flex items-center justify-center gap-2 transition bg-white dark:bg-slate-800 text-slate-900 dark:text-white shadow-xs"
      >
        <span>🍳</span>
        <span>Кухня</span>
        <span id="kitchen-badge" class="text-[11px] px-1.5 py-0.2 rounded-md bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 font-normal">0/3</span>
      </button>

      <button 
        id="btn-zone-hall" 
        class="py-2.5 px-3 rounded-lg text-sm font-semibold flex items-center justify-center gap-2 transition text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white"
      >
        <span>🍷</span>
        <span>Зал</span>
        <span id="hall-badge" class="text-[11px] px-1.5 py-0.2 rounded-md bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 font-normal">0/3</span>
      </button>
    </div>

    <!-- Active Tasks List -->
    <div class="space-y-3" id="tasks-container">
      <!-- Items generated dynamically -->
    </div>

    <!-- Additional General Note -->
    <div class="bg-white dark:bg-slate-800 rounded-xl p-3.5 border border-slate-200 dark:border-slate-700/80 shadow-xs space-y-1.5">
      <label for="general-comment" class="block text-xs font-semibold text-slate-600 dark:text-slate-400 uppercase tracking-wide">
        Загальний коментар або примітка (необов'язково)
      </label>
      <textarea 
        id="general-comment" 
        rows="2" 
        placeholder="Зауваження по зміні, залишки тощо..." 
        class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg p-2.5 text-sm text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-800 dark:focus:ring-slate-400 transition"
      ></textarea>
    </div>

    <!-- Action Controls -->
    <div class="pt-2 space-y-2.5">
      <button 
        id="btn-send-report" 
        class="w-full py-3.5 px-4 bg-slate-900 hover:bg-slate-800 dark:bg-slate-100 dark:hover:bg-white text-white dark:text-slate-900 font-bold rounded-xl text-sm transition active:scale-[0.99] flex items-center justify-center gap-2 shadow-xs cursor-pointer"
      >
        <span>✓</span>
        <span>Відправити звіт</span>
      </button>

      <div class="grid grid-cols-2 gap-2">
        <button 
          id="btn-copy" 
          class="py-2.5 px-3 bg-white dark:bg-slate-800 hover:bg-slate-50 dark:hover:bg-slate-750 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200 font-medium rounded-lg text-xs flex items-center justify-center gap-1.5 transition active:scale-95 cursor-pointer"
        >
          <span>📋</span> Скопіювати текст
        </button>

        <button 
          id="btn-reset" 
          class="py-2.5 px-3 bg-white dark:bg-slate-800 hover:bg-rose-50 dark:hover:bg-rose-950/20 border border-slate-200 dark:border-slate-700 text-slate-500 hover:text-rose-600 dark:hover:text-rose-400 font-medium rounded-lg text-xs flex items-center justify-center gap-1.5 transition active:scale-95 cursor-pointer"
        >
          <span>✕</span> Очистити форму
        </button>
      </div>
    </div>
  </main>

  <!-- Report Preview / Sent Modal -->
  <div id="report-modal" class="fixed inset-0 z-50 bg-black/50 backdrop-blur-xs flex items-center justify-center p-4 hidden">
    <div class="bg-white dark:bg-slate-900 rounded-2xl max-w-sm w-full p-4 border border-slate-200 dark:border-slate-800 shadow-xl space-y-3">
      <div class="flex items-center justify-between pb-2 border-b border-slate-100 dark:border-slate-800">
        <h3 class="text-sm font-bold text-slate-900 dark:text-white flex items-center gap-1.5">
          <span>📋</span> Сформований звіт
        </h3>
        <button id="close-modal" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 text-base font-bold">✕</button>
      </div>

      <pre id="modal-report-text" class="bg-slate-50 dark:bg-slate-950 p-3 rounded-xl text-xs text-slate-700 dark:text-slate-300 font-mono whitespace-pre-wrap max-h-60 overflow-y-auto border border-slate-200/60 dark:border-slate-800"></pre>

      <div class="flex gap-2 pt-1">
        <button id="modal-btn-copy" class="flex-1 py-2.5 bg-slate-900 dark:bg-white text-white dark:text-slate-900 font-semibold rounded-lg text-xs transition">
          Скопіювати
        </button>
        <button id="modal-btn-close" class="flex-1 py-2.5 bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 font-semibold rounded-lg text-xs transition">
          Закрити
        </button>
      </div>
    </div>
  </div>

  <!-- Notification Toast -->
  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 bg-slate-900 dark:bg-white text-white dark:text-slate-900 px-4 py-2 rounded-lg text-xs font-semibold shadow-lg opacity-0 pointer-events-none transition-all duration-200 flex items-center gap-2">
    <span id="toast-text">Сповіщення</span>
  </div>

  <script>
    // Checklist definitions
    const TASKS = {
      kitchen: [
        { id: 'k_oven', title: 'Вимитий пароконвектомат' },
        { id: 'k_surfaces', title: 'Чисті поверхні' },
        { id: 'k_preps', title: 'Наявність заготовок' }
      ],
      hall: [
        { id: 'h_windows', title: 'Чисті вікна' },
        { id: 'h_keeper', title: 'Чиста зона кіперу' },
        { id: 'h_cutlery', title: 'Чисті столові прибори' }
      ]
    };

    // State
    let currentZone = 'kitchen';
    let formData = {
      workerName: '',
      generalComment: '',
      // statuses: 'done' | 'issue' | 'pending'
      // comments: string
      items: {
        k_oven: { status: 'pending', comment: '' },
        k_surfaces: { status: 'pending', comment: '' },
        k_preps: { status: 'pending', comment: '' },
        h_windows: { status: 'pending', comment: '' },
        h_keeper: { status: 'pending', comment: '' },
        h_cutlery: { status: 'pending', comment: '' }
      }
    };

    // Initialize Telegram WebApp if running inside TG
    const tg = window.Telegram?.WebApp;
    if (tg) {
      try {
        tg.ready();
        tg.expand();
        const tgUser = tg.initDataUnsafe?.user;
        if (tgUser) {
          const name = `${tgUser.first_name || ''} ${tgUser.last_name || ''}`.trim();
          formData.workerName = name + (tgUser.username ? ` (@${tgUser.username})` : '');
        }
      } catch (e) {
        console.warn('Telegram WebApp context error', e);
      }
    }

    // Update real-time clock
    function updateClock() {
      const now = new Date();
      const dateStr = now.toLocaleDateString('uk-UA', { day: 'numeric', month: 'long', year: 'numeric' });
      const timeStr = now.toLocaleTimeString('uk-UA', { hour: '2-digit', minute: '2-digit' });
      document.getElementById('current-datetime').textContent = `${dateStr}, ${timeStr}`;
    }
    updateClock();
    setInterval(updateClock, 30000);

    // Render Checklist Items
    function renderTasks() {
      const container = document.getElementById('tasks-container');
      container.innerHTML = '';
      const list = TASKS[currentZone];

      list.forEach((task) => {
        const state = formData.items[task.id] || { status: 'pending', comment: '' };
        const card = document.createElement('div');
        card.className = `p-3.5 rounded-xl border transition-colors ${
          state.status === 'done' 
            ? 'bg-emerald-50/70 dark:bg-emerald-950/20 border-emerald-300 dark:border-emerald-800' 
            : state.status === 'issue'
            ? 'bg-amber-50/70 dark:bg-amber-950/20 border-amber-300 dark:border-amber-800'
            : 'bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700/80'
        }`;

        card.innerHTML = `
          <div class="flex items-center justify-between gap-3">
            <span class="text-sm font-semibold text-slate-800 dark:text-slate-100 ${state.status === 'done' ? 'line-through text-slate-500 dark:text-slate-400' : ''}">
              ${task.title}
            </span>

            <!-- Status Choice Buttons -->
            <div class="flex items-center gap-1.5 shrink-0">
              <button 
                type="button"
                onclick="setStatus('${task.id}', 'done')"
                class="px-2.5 py-1.5 rounded-lg text-xs font-semibold transition cursor-pointer ${
                  state.status === 'done'
                    ? 'bg-emerald-600 text-white shadow-xs'
                    : 'bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-600'
                }"
              >
                ✓ Виконано
              </button>

              <button 
                type="button"
                onclick="setStatus('${task.id}', 'issue')"
                class="px-2.5 py-1.5 rounded-lg text-xs font-semibold transition cursor-pointer ${
                  state.status === 'issue'
                    ? 'bg-amber-600 text-white shadow-xs'
                    : 'bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-600'
                }"
              >
                ⚠️ Зауваження
              </button>
            </div>
          </div>

          <!-- Note Field for Issues -->
          <div class="mt-2.5 ${state.status === 'issue' ? 'block' : 'hidden'}">
            <input 
              type="text" 
              placeholder="Опишіть зауваження або причину..." 
              value="${state.comment ? escapeHtml(state.comment) : ''}" 
              oninput="setComment('${task.id}', this.value)"
              class="w-full bg-white dark:bg-slate-900 border border-amber-300 dark:border-amber-700/60 rounded-lg px-2.5 py-1.5 text-xs text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-1 focus:ring-amber-500"
            />
          </div>
        `;
        container.appendChild(card);
      });

      updateBadges();
    }

    // Set Task Status
    window.setStatus = function(id, newStatus) {
      if (formData.items[id].status === newStatus) {
        formData.items[id].status = 'pending';
      } else {
        formData.items[id].status = newStatus;
      }
      renderTasks();
    };

    // Set Task Comment
    window.setComment = function(id, text) {
      if (formData.items[id]) {
        formData.items[id].comment = text;
      }
    };

    // Update Counter Badges
    function updateBadges() {
      const kDone = TASKS.kitchen.filter(t => formData.items[t.id]?.status === 'done').length;
      const hDone = TASKS.hall.filter(t => formData.items[t.id]?.status === 'done').length;

      document.getElementById('kitchen-badge').textContent = `${kDone}/${TASKS.kitchen.length}`;
      document.getElementById('hall-badge').textContent = `${hDone}/${TASKS.hall.length}`;
    }

    // Zone Navigation Handlers
    const btnKitchen = document.getElementById('btn-zone-kitchen');
    const btnHall = document.getElementById('btn-zone-hall');

    btnKitchen.addEventListener('click', () => {
      currentZone = 'kitchen';
      btnKitchen.className = 'py-2.5 px-3 rounded-lg text-sm font-semibold flex items-center justify-center gap-2 transition bg-white dark:bg-slate-800 text-slate-900 dark:text-white shadow-xs';
      btnHall.className = 'py-2.5 px-3 rounded-lg text-sm font-semibold flex items-center justify-center gap-2 transition text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white';
      renderTasks();
    });

    btnHall.addEventListener('click', () => {
      currentZone = 'hall';
      btnHall.className = 'py-2.5 px-3 rounded-lg text-sm font-semibold flex items-center justify-center gap-2 transition bg-white dark:bg-slate-800 text-slate-900 dark:text-white shadow-xs';
      btnKitchen.className = 'py-2.5 px-3 rounded-lg text-sm font-semibold flex items-center justify-center gap-2 transition text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white';
      renderTasks();
    });

    // Helper: Escape HTML
    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[m]);
    }

    // Build Report String
    function generateReportText() {
      const now = new Date();
      const dateStr = now.toLocaleDateString('uk-UA');
      const timeStr = now.toLocaleTimeString('uk-UA', { hour: '2-digit', minute: '2-digit' });
      const worker = document.getElementById('worker-name').value.trim() || 'Не вказано';
      const comment = document.getElementById('general-comment').value.trim();

      let text = `📋 ЗВІТ ЧЕК-ЛИСТА\n`;
      text += `📅 Дата: ${dateStr} ${timeStr}\n`;
      text += `👤 Відповідальний: ${worker}\n\n`;

      // Kitchen
      text += `🍳 КУХНЯ:\n`;
      TASKS.kitchen.forEach(t => {
        const item = formData.items[t.id];
        if (item.status === 'done') {
          text += `  ✅ ${t.title}\n`;
        } else if (item.status === 'issue') {
          text += `  ⚠️ ${t.title} [Зауваження: ${item.comment || 'без опису'}]\n`;
        } else {
          text += `  ⏳ ${t.title} [Не перевірено]\n`;
        }
      });

      // Hall
      text += `\n🍷 ЗАЛ:\n`;
      TASKS.hall.forEach(t => {
        const item = formData.items[t.id];
        if (item.status === 'done') {
          text += `  ✅ ${t.title}\n`;
        } else if (item.status === 'issue') {
          text += `  ⚠️ ${t.title} [Зауваження: ${item.comment || 'без опису'}]\n`;
        } else {
          text += `  ⏳ ${t.title} [Не перевірено]\n`;
        }
      });

      if (comment) {
        text += `\n📝 Примітка: ${comment}\n`;
      }

      return text;
    }

    // Show Toast
    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toast-text').textContent = msg;
      toast.classList.remove('opacity-0', 'pointer-events-none');
      toast.classList.add('opacity-100');
      setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0', 'pointer-events-none');
      }, 2200);
    }

    // Copy Utility
    function copyText(text) {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.focus();
      textarea.select();
      try {
        document.execCommand('copy');
        showToast('Звіт скопійовано в буфер обміну');
      } catch (err) {
        showToast('Помилка копіювання');
      }
      document.body.removeChild(textarea);
    }

    // Send Button Logic
    document.getElementById('btn-send-report').addEventListener('click', () => {
      const report = generateReportText();

      if (tg && typeof tg.sendData === 'function') {
        try {
          tg.sendData(JSON.stringify({
            worker: document.getElementById('worker-name').value.trim(),
            timestamp: new Date().toISOString(),
            items: formData.items,
            generalComment: document.getElementById('general-comment').value.trim(),
            textReport: report
          }));
          showToast('Дані надіслано в бот');
          return;
        } catch (e) {
          console.warn('sendData failed, fallback to modal', e);
        }
      }

      // If outside Telegram WebApp or sendData unavailable, show modal preview
      document.getElementById('modal-report-text').textContent = report;
      document.getElementById('report-modal').classList.remove('hidden');
    });

    // Copy Button Logic
    document.getElementById('btn-copy').addEventListener('click', () => {
      copyText(generateReportText());
    });

    // Reset Form
    document.getElementById('btn-reset').addEventListener('click', () => {
      Object.keys(formData.items).forEach(key => {
        formData.items[key] = { status: 'pending', comment: '' };
      });
      document.getElementById('general-comment').value = '';
      renderTasks();
      showToast('Форму очищено');
    });

    // Modal controls
    document.getElementById('close-modal').addEventListener('click', () => {
      document.getElementById('report-modal').classList.add('hidden');
    });
    document.getElementById('modal-btn-close').addEventListener('click', () => {
      document.getElementById('report-modal').classList.add('hidden');
    });
    document.getElementById('modal-btn-copy').addEventListener('click', () => {
      copyText(document.getElementById('modal-report-text').textContent);
      document.getElementById('report-modal').classList.add('hidden');
    });

    // Theme toggle
    const themeBtn = document.getElementById('theme-toggle');
    const themeIcon = document.getElementById('theme-icon');
    function applyTheme(isDark) {
      if (isDark) {
        document.documentElement.classList.add('dark');
        themeIcon.textContent = '☀️';
      } else {
        document.documentElement.classList.remove('dark');
        themeIcon.textContent = '🌙';
      }
    }
    const prefersDark = window.matchMedia && window.matchMedia('(p
